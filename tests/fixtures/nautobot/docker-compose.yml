services:
  nautobot:
    image: docker.io/networktocode/nautobot:2.4-py3.10
    ports:
      - "18080:8080"
    environment:
      NAUTOBOT_ALLOWED_HOSTS: "*"
      NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY}
      NAUTOBOT_DB_ENGINE: django.db.backends.postgresql
      NAUTOBOT_DB_HOST: nautobot-postgres
      NAUTOBOT_DB_NAME: ${NAUTOBOT_DB_NAME}
      NAUTOBOT_DB_USER: ${NAUTOBOT_DB_USER}
      NAUTOBOT_DB_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
      NAUTOBOT_REDIS_HOST: nautobot-redis
      NAUTOBOT_REDIS_PORT: ${NAUTOBOT_REDIS_PORT}
      NAUTOBOT_REDIS_PASSWORD: ${NAUTOBOT_REDIS_PASSWORD}
      NAUTOBOT_CREATE_SUPERUSER: "true"
      NAUTOBOT_SUPERUSER_NAME: ${NAUTOBOT_SUPERUSER_NAME}
      NAUTOBOT_SUPERUSER_EMAIL: ${NAUTOBOT_SUPERUSER_EMAIL}
      NAUTOBOT_SUPERUSER_PASSWORD: ${NAUTOBOT_SUPERUSER_PASSWORD}
      NAUTOBOT_SUPERUSER_API_TOKEN: ${NAUTOBOT_SUPERUSER_API_TOKEN}
    depends_on:
      nautobot-postgres:
        condition: service_healthy
      nautobot-redis:
        condition: service_started

  nautobot-redis:
    image: redis:7.2-alpine
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass $$NAUTOBOT_REDIS_PASSWORD
    environment:
      NAUTOBOT_REDIS_PASSWORD: ${NAUTOBOT_REDIS_PASSWORD}

  nautobot-postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${NAUTOBOT_DB_NAME}
      POSTGRES_USER: ${NAUTOBOT_DB_USER}
      POSTGRES_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
    volumes:
      - nautobot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nautobot_postgres_data:
