[package]
name = "nobs-cli"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "nobs_cli"
path = "src/lib.rs"

[[bin]]
name = "nobs"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossterm.workspace = true
nobs-core = { path = "../nobs-core" }
nobs-ssh = { path = "../nobs-ssh" }
nobs-tui = { path = "../nobs-tui" }

[dev-dependencies]
nobs-core = { path = "../nobs-core", features = ["fake"] }
