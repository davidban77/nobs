[workspace]
resolver = "2"
members = ["nobs-core", "nobs-cli", "nobs-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
ureq = { version = "=3.5.1", default-features = false }
serde_json = "=1.0.154"
toml = { version = "=1.2.0", default-features = false, features = ["parse", "serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=2.1.1"
minijinja = { version = "=3.1.0", features = ["serde"] }
base64 = "=0.23.1"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
