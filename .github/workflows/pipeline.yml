name: pipeline

on:
  workflow_call:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  checks:
    name: checks on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.133,cargo-audit@0.22.1
          fallback: none
      - run: cargo build --workspace
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo audit

  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: rustup component add llvm-tools
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target "$TARGET" -p nobs-cli
      - name: nobs --version
        run: |
          expected="nobs $(sh .github/scripts/version.sh)"
          actual=$("target/$TARGET/release/nobs" --version)
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "nobs --version printed '$actual', not '$expected'" >&2
            exit 1
          fi
      - name: static
        if: runner.os == 'Linux'
        run: |
          kind=$(file --brief "target/$TARGET/release/nobs")
          echo "$kind"
          case "$kind" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *) echo "nobs is not static" >&2; exit 1 ;;
          esac
      - name: pack
        env:
          COPYFILE_DISABLE: 1
        run: |
          mkdir dist
          tar -czf "dist/nobs-v$(sh .github/scripts/version.sh)-$PLATFORM.tar.gz" -C "target/$TARGET/release" nobs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nobs-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release-files:
    name: release files
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: one file in each archive, one sum for each archive
        run: |
          version=$(sh .github/scripts/version.sh)
          cd dist
          sha256sum nobs-v*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          for platform in macos-arm64 linux-x86_64 linux-aarch64; do
            archive="nobs-v$version-$platform.tar.gz"
            list=$(tar -tzf "$archive")
            echo "$archive holds: $list"
            if [ "$list" != nobs ]; then
              echo "$archive must hold the one file nobs" >&2
              exit 1
            fi
            unpacked=$(mktemp -d)
            tar -xzf "$archive" -C "$unpacked"
            if [ ! -x "$unpacked/nobs" ]; then
              echo "nobs in $archive cannot be run" >&2
              exit 1
            fi
            if ! grep -q "  $archive\$" SHA256SUMS; then
              echo "SHA256SUMS has no line for $archive" >&2
              exit 1
            fi
          done
          if [ "$(wc -l < SHA256SUMS)" -ne 3 ]; then
            echo "SHA256SUMS must have one line for each of the 3 archives" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
